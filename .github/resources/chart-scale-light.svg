<svg xmlns="http://www.w3.org/2000/svg" width="820" height="714" viewBox="0 0 820 714" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="t">Five computer-use servers reading File Explorer as the folder grows</title>
<desc id="d">munim-computer-use 0.8.0: 139 ms, 132 ms, 155 ms, 138 ms; 2008 tokens, 2012 tokens, 2012 tokens, 2015 tokens. Cua Driver 0.38.0: 199 ms, 176 ms, 177 ms, 191 ms; 3898 tokens, 3901 tokens, 3901 tokens, 3904 tokens. Windows-MCP 0.8.5: 770 ms, 770 ms, 784 ms, 755 ms; 3806 tokens, 3809 tokens, 3809 tokens, 3811 tokens. computer-use-mcp 7.8.0 (zavora): 430 ms, 495 ms, 433 ms, 520 ms; 9346 tokens, 9348 tokens, 9348 tokens, 9349 tokens. open-computer-use 1.1.2: 3946 ms, 3823 ms, 3700 ms, 4227 ms; 5858 tokens, 5861 tokens, 5861 tokens, 5852 tokens (for 100, 1000, 5000, 20000 files)</desc>
<rect width="820" height="714" rx="8" fill="#fcfcfb"/>
<text x="20" y="30" fill="#0b0b0b" font-size="16" font-weight="600" text-anchor="start">Reading a window as the folder grows, five servers on Windows 11</text><text x="20" y="50" fill="#52514e" font-size="12" font-weight="400" text-anchor="start">Each server's read tool on File Explorer showing 100 to 20,000 files, same PC, median of 10 warm calls.</text><text x="20" y="66" fill="#52514e" font-size="12" font-weight="400" text-anchor="start">Every server reads only the rows on screen, so folder size barely matters; what differs is the level.</text><line x1="20" x2="34" y1="88" y2="88" stroke="#2a78d6" stroke-width="2"/><circle cx="27" cy="88" r="3" fill="#2a78d6"/><text x="40" y="92" fill="#52514e" font-size="12" font-weight="600" text-anchor="start">munim-computer-use 0.8.0</text><line x1="270" x2="284" y1="88" y2="88" stroke="#eb6834" stroke-width="2"/><circle cx="277" cy="88" r="3" fill="#eb6834"/><text x="290" y="92" fill="#52514e" font-size="12" font-weight="400" text-anchor="start">Cua Driver 0.38.0</text><line x1="520" x2="534" y1="88" y2="88" stroke="#1baf7a" stroke-width="2"/><circle cx="527" cy="88" r="3" fill="#1baf7a"/><text x="540" y="92" fill="#52514e" font-size="12" font-weight="400" text-anchor="start">Windows-MCP 0.8.5</text><line x1="20" x2="34" y1="108" y2="108" stroke="#eda100" stroke-width="2"/><circle cx="27" cy="108" r="3" fill="#eda100"/><text x="40" y="112" fill="#52514e" font-size="12" font-weight="400" text-anchor="start">computer-use-mcp 7.8.0 (zavora)</text><line x1="270" x2="284" y1="108" y2="108" stroke="#e87ba4" stroke-width="2"/><circle cx="277" cy="108" r="3" fill="#e87ba4"/><text x="290" y="112" fill="#52514e" font-size="12" font-weight="400" text-anchor="start">open-computer-use 1.1.2</text><text x="64" y="138" fill="#52514e" font-size="12" font-weight="600" text-anchor="start">Time per read (log scale, lower is better)</text><line x1="64" x2="605" y1="370" y2="370" stroke="#c3c2b7" stroke-width="1"/><text x="56" y="374" fill="#898781" font-size="11" font-weight="400" text-anchor="end">0.1 s</text><line x1="64" x2="605" y1="331.01955957017725" y2="331.01955957017725" stroke="#e1e0d9" stroke-width="1"/><text x="56" y="335.01955957017725" fill="#898781" font-size="11" font-weight="400" text-anchor="end">0.2 s</text><line x1="64" x2="605" y1="279.49022021491135" y2="279.49022021491135" stroke="#e1e0d9" stroke-width="1"/><text x="56" y="283.49022021491135" fill="#898781" font-size="11" font-weight="400" text-anchor="end">0.5 s</text><line x1="64" x2="605" y1="240.50977978508863" y2="240.50977978508863" stroke="#e1e0d9" stroke-width="1"/><text x="56" y="244.50977978508863" fill="#898781" font-size="11" font-weight="400" text-anchor="end">1 s</text><line x1="64" x2="605" y1="201.52933935526588" y2="201.52933935526588" stroke="#e1e0d9" stroke-width="1"/><text x="56" y="205.52933935526588" fill="#898781" font-size="11" font-weight="400" text-anchor="end">2 s</text><line x1="64" x2="605" y1="150" y2="150" stroke="#e1e0d9" stroke-width="1"/><text x="56" y="154" fill="#898781" font-size="11" font-weight="400" text-anchor="end">5 s</text><text x="64" y="388" fill="#898781" font-size="11" font-weight="400" text-anchor="middle">100 files</text><text x="299.1121024147667" y="388" fill="#898781" font-size="11" font-weight="400" text-anchor="middle">1,000 files</text><text x="463.44840965906656" y="388" fill="#898781" font-size="11" font-weight="400" text-anchor="middle">5,000 files</text><text x="605" y="388" fill="#898781" font-size="11" font-weight="400" text-anchor="middle">20,000 files</text><polyline points="64.0,163.3 299.1,165.1 463.4,166.9 605.0,159.4" fill="none" stroke="#e87ba4" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="64" cy="163.31326809457474" r="4" fill="#e87ba4" stroke="#fcfcfb" stroke-width="2"/><circle cx="299.1121024147667" cy="165.0941189804938" r="4" fill="#e87ba4" stroke="#fcfcfb" stroke-width="2"/><circle cx="463.44840965906656" cy="166.93321340916114