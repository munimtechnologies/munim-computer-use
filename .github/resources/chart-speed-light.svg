<svg xmlns="http://www.w3.org/2000/svg" width="820" height="300" viewBox="0 0 820 300" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="t">munim-computer-use speedups release over release</title>
<desc id="d">macOS Finder, 2,000 files: 2.2 s before, 0.165 s now; Windows list, 3,000 rows: 2.3 s before, 0.85 s now; Settle after a field edit: 0.35 s before, 0.23 s now</desc>
<rect width="820" height="300" rx="8" fill="#fcfcfb"/>
<text x="20" y="30" fill="#0b0b0b" font-size="16" font-weight="600" text-anchor="start">Faster with each release</text><text x="20" y="50" fill="#52514e" font-size="12" font-weight="400" text-anchor="start">get_app_state read time and return_state settle time, before and after the changes described under Why it works well.</text><rect x="20" y="65" width="10" height="10" rx="2" fill="#c3c2b7"/><text x="36" y="74" fill="#52514e" font-size="12" font-weight="400" text-anchor="start">Before</text><rect x="90" y="65" width="10" height="10" rx="2" fill="#2a78d6"/><text x="106" y="74" fill="#52514e" font-size="12" font-weight="400" text-anchor="start">Now</text><line x1="210" x2="210" y1="92" y2="260" stroke="#c3c2b7" stroke-width="1"/><text x="210" y="278" fill="#898781" font-size="11" font-weight="400" text-anchor="middle">0 s</text><line x1="304" x2="304" y1="92" y2="260" stroke="#e1e0d9" stroke-width="1"/><text x="304" y="278" fill="#898781" font-size="11" font-weight="400" text-anchor="middle">0.5 s</text><line x1="398" x2="398" y1="92" y2="260" stroke="#e1e0d9" stroke-width="1"/><text x="398" y="278" fill="#898781" font-size="11" font-weight="400" text-anchor="middle">1 s</text><line x1="492" x2="492" y1="92" y2="260" stroke="#e1e0d9" stroke-width="1"/><text x="492" y="278" fill="#898781" font-size="11" font-weight="400" text-anchor="middle">1.5 s</text><line x1="586" x2="586" y1="92" y2="260" stroke="#e1e0d9" stroke-width="1"/><text x="586" y="278" fill="#898781" font-size="11" font-weight="400" text-anchor="middle">2 s</text><line x1="680" x2="680" y1="92" y2="260" stroke="#e1e0d9" stroke-width="1"/><text x="680" y="278" fill="#898781" font-size="11" font-weight="400" text-anchor="middle">2.5 s</text><text x="20" y="124" fill="#0b0b0b" font-size="13" font-weight="400" text-anchor="start">macOS Finder, 2,000 files</text><path d="M210,100h409.6000000000001a4,4 0 0 1 4,4v10a4,4 0 0 1 -4,4h-409.6000000000001z" fill="#c3c2b7"/><text x="629.6000000000001" y="114" fill="#52514e" font-size="12" font-weight="400" text-anchor="start">2.2 s</text><path d="M210,120h27.020000000000003a4,4 0 0 1 4,4v10a4,4 0 0 1 -4,4h-27.020000000000003z" fill="#2a78d6"/><text x="247.02" y="134" fill="#0b0b0b" font-size="12" font-weight="600" text-anchor="start">165 ms  (13.3× faster)</text><text x="20" y="180" fill="#0b0b0b" font-size="13" font-weight="400" text-anchor="start">Windows list, 3,000 rows</text><path d="M210,156h428.4a4,4 0 0 1 4,4v10a4,4 0 0 1 -4,4h-428.4z" fill="#c3c2b7"/><text x="648.4" y="170" fill="#52514e" font-size="12" font-weight="400" text-anchor="start">2.3 s</text><path d="M210,176h155.79999999999998a4,4 0 0 1 4,4v10a4,4 0 0 1 -4,4h-155.79999999999998z" fill="#2a78d6"/><text x="375.79999999999995" y="190" fill="#0b0b0b" font-size="12" font-weight="600" text-anchor="start">850 ms  (2.7× faster)</text><text x="20" y="236" fill="#0b0b0b" font-size="13" font-weight="400" text-anchor="start">Settle after a field edit</text><path d="M210,212h61.8a4,4 0 0 1 4,4v10a4,4 0 0 1 -4,4h-61.8z" fill="#c3c2b7"/><text x="281.8" y="226" fill="#52514e" font-size="12" font-weight="400" text-anchor="start">350 ms</text><path d="M210,232h39.24a4,4 0 0 1 4,4v10a4,4 0 0 1 -4,4h-39.24z" fill="#2a78d6"/><text x="259.24" y="246" fill="#0b0b0b" font-size="12" font-weight="600" text-anchor="start">230 ms  (1.5× faster)</text>
</svg>
