<text x="20" y="30" fill="#f0efec" font-size="16" font-weight="600" text-anchor="start">Reading a window as the folder grows: macOS 27 · Finder (list view)</text><text x="20" y="50" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start">Each server's read tool on a folder of 100 to 20,000 files, median of 10 warm calls. MacBook Air (M1), macOS 27.2, one 1920×1080 display.</text><text x="20" y="66" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start">Lower is better on both panels. A flat line means the server reads only what is on screen, however big the folder.</text><line x1="20" x2="34" y1="88" y2="88" stroke="#3987e5" stroke-width="2"/><circle cx="27" cy="88" r="3" fill="#3987e5"/><text x="40" y="92" fill="#c3c2b7" font-size="12" font-weight="600" text-anchor="start">munim-computer-use 0.10.0</text><line x1="270" x2="284" y1="88" y2="88" stroke="#d95926" stroke-width="2"/><circle cx="277" cy="88" r="3" fill="#d95926"/><text x="290" y="92" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start">Cua Driver 0.38.0</text><line x1="520" x2="534" y1="88" y2="88" stroke="#c98500" stroke-width="2"/><circle cx="527" cy="88" r="3" fill="#c98500"/><text x="540" y="92" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start">computer-use-mcp 7.8.0 (zavora)</text><line x1="20" x2="34" y1="108" y2="108" stroke="#d55181" stroke-width="2"/><circle cx="27" cy="108" r="3" fill="#d55181"/><text x="40" y="112" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start">open-computer-use 1.1.3</text><line x1="270" x2="284" y1="108" y2="108" stroke="#199e70" stroke-width="2"/><circle cx="277" cy="108" r="3" fill="#199e70"/><text x="290" y="112" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start">MacOS-MCP 0.4.7</text><text x="64" y="138" fill="#c3c2b7" font-size="12" font-weight="600" text-anchor="start">Time per read (log scale, lower is better)</text><line x1="64" x2="605" y1="350" y2="350" stroke="#383835" 