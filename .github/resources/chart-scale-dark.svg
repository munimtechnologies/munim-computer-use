<svg xmlns="http://www.w3.org/2000/svg" width="820" height="714" viewBox="0 0 820 714" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="t">Five computer-use servers reading File Explorer as the folder grows</title>
<desc id="d">munim-computer-use 0.7.3: 235 ms, 225 ms, 237 ms, 237 ms; 2008 tokens, 2012 tokens, 2012 tokens, 2015 tokens. Cua Driver 0.38.0: 169 ms, 174 ms, 185 ms, 176 ms; 3898 tokens, 3901 tokens, 3901 tokens, 3904 tokens. Windows-MCP 0.8.5: 790 ms, 689 ms, 771 ms, 756 ms; 3855 tokens, 3857 tokens, 3858 tokens, 3860 tokens. computer-use-mcp 7.8.0 (zavora): 431 ms, 487 ms, 442 ms, 421 ms; 9346 tokens, 9346 tokens, 9348 tokens, 9351 tokens. open-computer-use 1.1.2: 3427 ms, 3735 ms, 3513 ms, 3202 ms; 5858 tokens, 5849 tokens, 5861 tokens, 5864 tokens (for 100, 1000, 5000, 20000 files)</desc>
<rect width="820" height="714" rx="8" fill="#1a1a19"/>
<text x="20" y="30" fill="#f0efec" font-size="16" font-weight="600" text-anchor="start">Reading a window as the folder grows, five servers on Windows 11</text><text x="20" y="50" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start">Each server's read tool on File Explorer showing 100 to 20,000 files, same PC, median of 10 warm calls.</text><text x="20" y="66" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start">Every server reads only the rows on screen, so folder size barely matters; what differs is the level.</text><line x1="20" x2="34" y1="88" y2="88" stroke="#3987e5" stroke-width="2"/><circle cx="27" cy="88" r="3" fill="#3987e5"/><text x="40" y="92" fill="#c3c2b7" font-size="12" font-weight="600" text-anchor="start">munim-computer-use 0.7.3</text><line x1="270" x2="284" y1="88" y2="88" stroke="#d95926" stroke-width="2"/><circle cx="277" cy="88" r="3" fill="#d95926"/><text x="290" y="92" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start">Cua Driver 0.38.0</text><line x1="520" x2="534" y1="88" y2="88" stroke="#199e70" stroke-width="2"/><circle cx="527" cy="88" r="3" fill="#199e70"/><text x="540" y="92" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start">Windows-MCP 0.8.5</text><line x1="20" x2="34" y1="108" y2="108" stroke="#c98500" stroke-width="2"/><circle cx="27" cy="108" r="3" fill="#c98500"/><text x="40" y="112" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start">computer-use-mcp 7.8.0 (zavora)</text><line x1="270" x2="284" y1="108" y2="108" stroke="#d55181" stroke-width="2"/><circle cx="277" cy="108" r="3" fill="#d55181"/><text x="290" y="112" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start">open-computer-use 1.1.2</text><text x="64" y="138" fill="#c3c2b7" font-size="12" font-weight="600" text-anchor="start">Time per read (log scale, lower is better)</text><line x1="64" x2="630" y1="370" y2="370" stroke="#383835" stroke-width="1"/><text x="56" y="374" fill="#898