<title id="t">Computer-use servers reading a growing folder: Windows 11 · File Explorer</title>
<desc id="d">munim-computer-use 0.10.0: 117 ms, 119 ms, 127 ms, 124 ms; 2008 tokens, 2012 tokens, 2012 tokens, 2014 tokens. Cua Driver 0.38.0: 148 ms, 162 ms, 153 ms, 158 ms; 3898 tokens, 3901 tokens, 3901 tokens, 3904 tokens. Windows-MCP 0.8.8: 15369 ms, 15705 ms, 15237 ms, 15593 ms; 3869 tokens, 1211 tokens, 3871 tokens, 3873 tokens. computer-use-mcp 7.8.0 (zavora): 438 ms, 395 ms, 428 ms, 404 ms; 9343 tokens, 9346 tokens, 9348 tokens, 9351 tokens. open-computer-use 1.1.3: 3086 ms, 2964 ms, 3226 ms, 3216 ms; 4885 tokens, 4888 tokens, 4900 tokens, 4903 tokens (for 100, 1000, 5000, 20000 files)</desc>
