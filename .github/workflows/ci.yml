name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: cargo test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: windows-linux
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        # xcap pulls in PipeWire/libspa (through bindgen, hence libclang), DRM,
        # GBM, EGL and Wayland for screen capture, plus XCB for X11. AT-SPI,
        # D-Bus (zbus), XTEST (x11rb) and the clipboard are pure Rust.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config clang libclang-dev \
            libpipewire-0.3-dev libspa-0.2-dev \
            libdrm-dev libgbm-dev libegl-dev libwayland-dev \
            libxcb1-dev libxcb-randr0-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows-linux
      - run: cargo test --locked
      - name: Install Python for Windows native-host regression
        if: runner.os == 'Windows'
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Windows native-host backend EOF and restart
        if: runner.os == 'Windows'
        working-directory: .
        run: |
          cargo build --locked --manifest-path windows-linux/Cargo.toml
          python scripts/test-native-host-restart.py --binary windows-linux/target/debug/munim-computer-use.exe
      - name: browser tools end to end (real Chrome)
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          cargo build --release --locked --manifest-path windows-linux/Cargo.toml
          chrome=$(npx -y @puppeteer/browsers install chrome@stable --path "$RUNNER_TEMP/cft" | tail -1 | sed 's/^[^ ]* //')
          node scripts/e2e-browser.mjs --server "$PWD/windows-linux/target/release/munim-computer-use" --chrome "$chrome"

  swift:
    name: swift build (macOS)
    runs-on: macos-15
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@v7
      - run: swift build -c release
      - name: bridge keeps serving new peers with many connected
        working-directory: .
        run: node scripts/bridge-peers.test.mjs macos/.build/release/munim-computer-use 120
      - name: browser tools end to end (real Chrome)
        working-directory: .
        run: |
          chrome=$(npx -y @puppeteer/browsers install chrome@stable --path "$RUNNER_TEMP/cft" | tail -1 | sed 's/^[^ ]* //')
          node scripts/e2e-browser.mjs --server "$PWD/macos/.build/release/munim-computer-use" --chrome "$chrome"

  node:
    name: extension tests and tool parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node --test chrome-extension/background.test.mjs
      - run: node scripts/build-extension.test.mjs
      - run: node scripts/check-tool-parity.mjs
      - run: node scripts/tool-defs.mjs --check
      - run: node --check npm/bin/munim-computer-use.js
