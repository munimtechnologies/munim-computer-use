name: Deprecate MCP Registry Entry

# The registry keys a server on its name, so renaming the server publishes a new
# entry and leaves the old one active. This marks a superseded name (or a bad
# version) deprecated, using the same GitHub OIDC identity as the publish job.
on:
  workflow_dispatch:
    inputs:
      server:
        description: "Server name, e.g. io.github.munimtechnologies/computer-use"
        required: true
      version:
        description: "Version to update (ignored when all-versions is true)"
        required: false
      all_versions:
        description: "Apply to every version of the server"
        type: boolean
        default: false
      status:
        description: "New status"
        type: choice
        options: [deprecated, active, deleted]
        default: deprecated
      message:
        description: "Message shown to clients"
        required: false
        default: "Renamed to io.github.munimtechnologies/munim-computer-use"

jobs:
  deprecate:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Install mcp-publisher
        # Pinned to a release and checked against its published digest, so a
        # compromised or changed "latest" cannot run with the OIDC token.
        env:
          MCP_PUBLISHER_VERSION: "1.8.1"
          MCP_PUBLISHER_SHA256: "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc"
        run: |
          set -eu
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc
      - name: Update status
        env:
          SERVER: ${{ inputs.server }}
          VERSION: ${{ inputs.version }}
          STATUS: ${{ inputs.status }}
          MESSAGE: ${{ inputs.message }}
          ALL: ${{ inputs.all_versions }}
        run: |
          set -eu
          # mcp-publisher asks "Continue? [y/N]" and reads it from stdin, which
          # is closed in Actions; answer it so the run is non-interactive.
          if [ "$ALL" = "true" ]; then
            yes | ./mcp-publisher status --status "$STATUS" --message "$MESSAGE" --all-versions "$SERVER"
          else
            [ -n "$VERSION" ] || { echo "version is required unless all-versions is set" >&2; exit 1; }
            yes | ./mcp-publisher status --status "$STATUS" --message "$MESSAGE" "$SERVER" "$VERSION"
          fi
