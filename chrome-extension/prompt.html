<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Computer Use</title>
<meta name="color-scheme" content="light dark">
<style>
  :root { --fg: #1d1d1f; --muted: #6e6e73; --line: #d2d2d7; --bg: #fff; --field: #f5f5f7; --accent: #0a66ff; --warn: #b3261e; }
  @media (prefers-color-scheme: dark) {
    :root { --fg: #f5f5f7; --muted: #a1a1a6; --line: #3a3a3c; --bg: #1c1c1e; --field: #2c2c2e; --accent: #4c8dff; --warn: #ff6b60; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 20px 22px; font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; color: var(--fg); background: var(--bg); }
  h1 { font-size: 16px; margin: 0 0 12px; font-weight: 600; }
  .origin { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; font-weight: 600; word-break: break-all; }
  .origin small { display: block; font-weight: 400; color: var(--muted); }
  .warn { color: var(--warn); font-size: 13px; margin: 8px 0 0; }
  .reason { margin: 12px 0 0; color: var(--muted); font-size: 13px; }
  .reason q { color: var(--fg); }
  form { margin: 14px 0 0; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
  input { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--field); color: var(--fg); font: inherit; }
  input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .note { font-size: 12px; color: var(--muted); margin: 12px 0 0; }
  .buttons { display: flex; justify-content: flex-end; gap: 8px; margin: 16px 0 0; }
  button { padding: 7px 14px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--fg); font: inherit; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <h1 id="title">Computer Use</h1>
  <div class="origin"><span aria-hidden="true" id="lock">🔒</span><span><span id="host"></span><small id="origin"></small></span></div>
  <p class="warn" id="insecure" hidden>This page is not using HTTPS. Anything you type here can be read on the network.</p>
  <p class="reason" id="reason-line" hidden>The agent says: <q id="reason"></q></p>
  <form id="form">
    <div id="fields"></div>
    <p class="note" id="note"></p>
    <div class="buttons">
      <button type="button" id="cancel">Cancel</button>
      <button type="submit" class="primary" id="ok">Continue</button>
    </div>
  </form>
  <script src="prompt.js"></script>
</body>
</html>
